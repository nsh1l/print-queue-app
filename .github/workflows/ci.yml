name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-self-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WinUIMCPServer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: >-
          dotnet publish --configuration Release --runtime win-x64 --self-contained true
          -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false --output publish
      - shell: pwsh
        run: |
          $process = Start-Process .\publish\PrintQueueApp.WinUI.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
